# Redpanda Connect unit tests for the rendered ADS-B pipeline.
# HexIdent is field index 4. Index 5 is FlightID and must not become the key.
tests:
  - name: uppercases icao24 and keeps the raw sbs line
    input_batch:
      - content: "MSG,3,1,1,abc123,999,2024/01/01,00:00:00.000,2024/01/01,00:00:00.000,,35000,,,,,,,,,,,"
    output_batches:
      -
        - content_equals: "MSG,3,1,1,abc123,999,2024/01/01,00:00:00.000,2024/01/01,00:00:00.000,,35000,,,,,,,,,,,"
          metadata_equals:
            kafka_key: ABC123

  - name: assigns a key per message
    input_batch:
      - content: "MSG,3,1,1,abc123,1,2024/01/01,00:00:00.000,2024/01/01,00:00:00.000,,35000,,,,,,,,,,,"
      - content: "MSG,4,1,1,00abef,1,2024/01/01,00:00:01.000,2024/01/01,00:00:01.000,,35000,,,,,,,,,,,"
    output_batches:
      -
        - content_equals: "MSG,3,1,1,abc123,1,2024/01/01,00:00:00.000,2024/01/01,00:00:00.000,,35000,,,,,,,,,,,"
          metadata_equals:
            kafka_key: ABC123
        - content_equals: "MSG,4,1,1,00abef,1,2024/01/01,00:00:01.000,2024/01/01,00:00:01.000,,35000,,,,,,,,,,,"
          metadata_equals:
            kafka_key: 00ABEF

  - name: trims whitespace around the hex ident
    input_batch:
      - content: "MSG,3,1,1, ab12ef ,42,2024/01/01,00:00:00.000,2024/01/01,00:00:00.000,,,,,,,,,,,,,"
    output_batches:
      -
        - content_equals: "MSG,3,1,1, ab12ef ,42,2024/01/01,00:00:00.000,2024/01/01,00:00:00.000,,,,,,,,,,,,,"
          metadata_equals:
            kafka_key: AB12EF

  - name: publishes a line with an empty hex ident
    input_batch:
      - content: "MSG,3,1,1,,7,2024/01/01,00:00:00.000,2024/01/01,00:00:00.000,,,,,,,,,,,,,"
    output_batches:
      -
        - content_equals: "MSG,3,1,1,,7,2024/01/01,00:00:00.000,2024/01/01,00:00:00.000,,,,,,,,,,,,,"
          metadata_equals:
            kafka_key: ""

  - name: publishes a short line
    input_batch:
      - content: "MSG,1,2"
    output_batches:
      -
        - content_equals: "MSG,1,2"
          metadata_equals:
            kafka_key: ""

  - name: publishes non csv text
    input_batch:
      - content: "not a basestation message"
    output_batches:
      -
        - content_equals: "not a basestation message"
          metadata_equals:
            kafka_key: ""

  - name: rejects hex that is not six digits
    input_batch:
      - content: "MSG,3,1,1,abc12,1,2024/01/01,00:00:00.000,2024/01/01,00:00:00.000,,1,,,,,,,,,,,"
      - content: "MSG,3,1,1,abc1234,1,2024/01/01,00:00:00.000,2024/01/01,00:00:00.000,,1,,,,,,,,,,,"
      - content: "MSG,3,1,1,zzzzzz,1,2024/01/01,00:00:00.000,2024/01/01,00:00:00.000,,1,,,,,,,,,,,"
      - content: "MSG,3,1,1,~abc123,1,2024/01/01,00:00:00.000,2024/01/01,00:00:00.000,,1,,,,,,,,,,,"
    output_batches:
      -
        - content_equals: "MSG,3,1,1,abc12,1,2024/01/01,00:00:00.000,2024/01/01,00:00:00.000,,1,,,,,,,,,,,"
          metadata_equals:
            kafka_key: ""
        - content_equals: "MSG,3,1,1,abc1234,1,2024/01/01,00:00:00.000,2024/01/01,00:00:00.000,,1,,,,,,,,,,,"
          metadata_equals:
            kafka_key: ""
        - content_equals: "MSG,3,1,1,zzzzzz,1,2024/01/01,00:00:00.000,2024/01/01,00:00:00.000,,1,,,,,,,,,,,"
          metadata_equals:
            kafka_key: ""
        - content_equals: "MSG,3,1,1,~abc123,1,2024/01/01,00:00:00.000,2024/01/01,00:00:00.000,,1,,,,,,,,,,,"
          metadata_equals:
            kafka_key: ""
