replicaCount: 0

components:
  adsbtracker: true

ingress:
  enabled: false
  host: trakr.vibeify.co

postgresql:
  persistence:
    storageClass: openebs-lvmpv

pgadmin:
  auth:
    email: admin@vibeify.co
  ingress:
    enabled: true
    className: traefik
    host: trakr-pgadmin.vibeify.co

redpanda:
  console:
    enabled: true
    ingress:
      enabled: true
      className: traefik
      hosts:
        - host: trakr-redpanda.vibeify.co
          paths:
            - path: /
              pathType: Prefix
  storage:
    persistentVolume:
      storageClass: openebs-lvmpv
    tiered:
      persistentVolume:
        storageClass: openebs-lvmpv

adsbtracker:
  image:
    repository: ghcr.io/trak-r/ads-b-basestationreader
    tag: "6ffe327e88a1715049acd397f32923ddd73b7393"
  ingress:
    enabled: true
    className: traefik
    host: trakr-adsbtracker.vibeify.co
    tls:
      enabled: false
  feed:
    host: trakr-adsb-simulator
    port: 30003
  persistence:
    storageClass: openebs-lvmpv
