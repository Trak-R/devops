replicaCount: 0

components:
  simulator: false
  api: false

ingress:
  enabled: false
  host: trakr.vibeify.co

postgresql:
  persistence:
    storageClass: openebs-lvmpv

pgadmin:
  auth:
    email: admin@vibeify.co
  ingress:
    enabled: true
    className: traefik
    host: trakr-pgadmin.vibeify.co

redpanda:
  console:
    enabled: true
    ingress:
      enabled: true
      className: traefik
      hosts:
        - host: trakr-redpanda.vibeify.co
          paths:
            - path: /
              pathType: Prefix
  storage:
    persistentVolume:
      storageClass: openebs-lvmpv
    tiered:
      persistentVolume:
        storageClass: openebs-lvmpv

simulator:
  image:
    repository: ghcr.io/trak-r/ads-b-basestationreader
    tag: d4ce96d6c8ddf4c221467ff53ed3ec058dfd45a1

# Empty address uses this release's simulator Service, <fullname>-simulator:30003.
connect:
  adsb:
    enabled: false

# components.api stays false until api.image.tag is a published SHA.
# deploy-dev writes that tag and does not change the flag.
api:
  image:
    repository: ghcr.io/trak-r/api
    tag: ""
  ingress:
    enabled: true
    className: traefik
    host: trakr-api.vibeify.co
