replicaCount: 0

components:
  simulator: true

ingress:
  enabled: false
  host: trakr.vibeify.co

postgresql:
  persistence:
    storageClass: openebs-lvmpv

pgadmin:
  auth:
    email: admin@vibeify.co
  ingress:
    enabled: true
    className: traefik
    host: trakr-pgadmin.vibeify.co

redpanda:
  console:
    enabled: true
    ingress:
      enabled: true
      className: traefik
      hosts:
        - host: trakr-redpanda.vibeify.co
          paths:
            - path: /
              pathType: Prefix
  storage:
    persistentVolume:
      storageClass: openebs-lvmpv
    tiered:
      persistentVolume:
        storageClass: openebs-lvmpv

# unpublished is not a published image. Replace it with the commit SHA of a
# BaseStationReader.Simulator build before installing this release.
simulator:
  image:
    repository: ghcr.io/trak-r/ads-b-basestationreader
    tag: unpublished

# The simulator Service. Connect opens a TCP client to that host:port.
connect:
  adsb:
    enabled: true
    address: trakr-simulator:30003
