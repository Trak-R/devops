replicaCount: 1

image:
  repository: ghcr.io/trak-r/trakr
  # Empty uses the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# docker-registry Secret for ghcr.io. Create it in the release namespace before install.
# It is attached to pods that pull from GHCR.
imagePullSecrets:
  - name: trakr-ghcr

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  containerPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: chart-example.local
  path: /
  pathType: Prefix

probes:
  enabled: true
  path: /healthz

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

# Parent flags. These are not passed into the subcharts.
components:
  redpanda: true
  connect: true
  postgresql: true
  pgadmin: true
  # BaseStation simulator. image.repository and image.tag are required when this is true.
  simulator: false
  # TrakR API. image.repository and image.tag are required when this is true.
  # components.postgresql must stay true. The pod sets LOG_FILE empty and logs to stdout.
  api: true

# Official Redpanda chart. One broker, in-cluster only, TLS off.
# Console stays off here. Dev turns it on at https://trakr-redpanda.vibeify.co.
# Resource and volume defaults come from that chart (1 core, 2.5Gi memory, 20Gi volume).
# That chart names its Service after the Helm release. This chart's release is
# "trakr", which is also the application Service, so the broker name is pinned here.
redpanda:
  fullnameOverride: trakr-redpanda
  config:
    cluster:
      auto_create_topics_enabled: true
  statefulset:
    replicas: 1
  tls:
    enabled: false
  external:
    enabled: false
  console:
    enabled: false
  # Empty uses the cluster default. The datadir claim is created by default.
  # The tiered claim is created when storage.tiered.mountType is persistentVolume.
  storage:
    persistentVolume:
      storageClass: ""
    tiered:
      persistentVolume:
        storageClass: ""

# Official Redpanda Connect chart.
# nameOverride keeps the Service at <release>-connect. The chart's own default
# name is redpanda-connect.
# The pipeline is baked into connect.image. The chart mounts <release>-connect-env
# at /connect/runtime. The entrypoint reads ADSB_ADDRESS, ADSB_BROKER, ADSB_TOPIC,
# ADSB_DEAD_LETTER_TOPIC, and ADSB_ENABLED from that directory. An empty
# adsb.address becomes <fullname>-simulator:<simulator.service.port>.
# Leave adsb.enabled false where there is no BaseStation feed. The image then
# runs /connect/placeholder.yaml. When adsb.enabled is true, Connect opens a TCP
# client to ADSB_ADDRESS and writes each valid MSG line as JSON to adsb.topic.
# The Kafka key is the uppercase ICAO24 address. Lines that are not MSG records,
# or that have no valid ICAO24, are written as JSON to adsb.deadLetterTopic.
# args must be non-empty. An empty args list makes the Connect chart append
# -c /redpanda-connect.yaml, which this image does not use.
# connect.image.tag is the commit SHA from the connect workflow. "unset" is not
# a published tag. The Connect chart uses its appVersion when the tag is empty.
connect:
  nameOverride: connect
  image:
    repository: ghcr.io/trak-r/connect
    tag: "unset"
    pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: trakr-ghcr
  command:
    - /connect/entrypoint.sh
  args:
    - run
  extraVolumes:
    - name: runtime
      configMap:
        name: '{{ printf "%s-connect-env" .Release.Name }}'
  extraVolumeMounts:
    - name: runtime
      mountPath: /connect/runtime
      readOnly: true
  commonAnnotations:
    checksum/adsb-env: '{{ printf "%s|%s|%s|%s|%s|%v" .Release.Name (.Values.adsb.address | default "") .Values.adsb.broker .Values.adsb.topic .Values.adsb.deadLetterTopic .Values.adsb.enabled | sha256sum }}'
  adsb:
    enabled: false
    address: ""
    topic: adsb.basestation
    deadLetterTopic: adsb.basestation.dlq
    broker: trakr-redpanda:9093

# Single Postgres instance using the official image. PostgreSQL 17 keeps
# PGDATA at /var/lib/postgresql/data.
postgresql:
  image:
    repository: postgres
    tag: "17"
    pullPolicy: IfNotPresent
  auth:
    username: trakr
    database: trakr
    # Empty generates a password on install and keeps it across upgrades.
    # existingSecret must contain POSTGRES_USER, POSTGRES_PASSWORD, and POSTGRES_DB.
    # username and database above must match that Secret; probes use these values.
    password: ""
    existingSecret: ""
  persistence:
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# BaseStationReader.Simulator. The image is built from docker/Dockerfile.simulator.
# image.repository and image.tag are required when components.simulator is true.
# The log file path must stay under the emptyDir mounted at its directory.
simulator:
  image:
    repository: ghcr.io/trak-r/ads-b-basestationreader
    tag: ""
    pullPolicy: IfNotPresent
    # The published image is linux/amd64. Set false after publishing a native image for another architecture.
    pinAmd64: true
  imagePullSecrets:
    - name: trakr-ghcr
  service:
    port: 30003
  settings:
    port: 30003
    sendInterval: 100
    numberOfAircraft: 10
    receiverLatitude: 51.4711123
    receiverLongitude: -0.4646874
    logFile: /var/opt/adsb-simulator/ReceiverSimulator.log
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# pgAdmin web UI for the Postgres instance above. The image runs as UID 5050
# and listens on 8080 because the pod cannot bind privileged ports.
# Empty password generates one on install and keeps it across upgrades.
# existingSecret must contain PGADMIN_DEFAULT_PASSWORD.
pgadmin:
  image:
    repository: dpage/pgadmin4
    tag: "9.19.0"
    pullPolicy: IfNotPresent
  auth:
    # false runs desktop mode with no login and no master password.
    enabled: true
    email: admin@example.com
    password: ""
    existingSecret: ""
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: chart-example.local
    path: /
    pathType: Prefix
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

# TrakR API. The image command is uvicorn on port 8000. Health is GET /health.
# image.repository and image.tag are required when components.api is true.
# Before the API starts, the migrate init container runs
# `alembic -c /app/apps/api/alembic.ini upgrade head`.
# The process must skip logs/app.log when LOG_FILE is empty. The chart sets that
# variable to an empty string. Pods use the chart security context: UID 65532,
# a read-only root filesystem, and an emptyDir at /tmp.
# Empty secretKey generates one on install and keeps it across upgrades.
# existingSecret must contain SECRET_KEY.
api:
  replicaCount: 1
  image:
    repository: ghcr.io/trak-r/api
    tag: ""
    pullPolicy: IfNotPresent
  auth:
    secretKey: ""
    existingSecret: ""
  corsOrigins:
    - "*"
  service:
    port: 80
    containerPort: 8000
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: chart-example.local
    path: /
    pathType: Prefix
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
