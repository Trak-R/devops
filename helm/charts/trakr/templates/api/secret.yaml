{{- if and .Values.components.api (not .Values.api.auth.existingSecret) }}
{{- $secretName := include "trakr.api.secretName" . }}
{{- $secretKey := .Values.api.auth.secretKey }}
{{- if not $secretKey }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if and $existing $existing.data (index $existing.data "SECRET_KEY") }}
{{- $secretKey = index $existing.data "SECRET_KEY" | b64dec }}
{{- else }}
{{- $secretKey = randAlphaNum 48 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "trakr.api.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ $secretKey | quote }}
{{- end }}
