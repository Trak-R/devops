{{- if .Values.components.api }}
{{- if not .Values.components.postgresql }}
{{- fail "components.api requires components.postgresql" }}
{{- end }}
{{- if .Values.api.auth.existingSecret }}
{{- $secret := lookup "v1" "Secret" .Release.Namespace .Values.api.auth.existingSecret }}
{{- if and $secret $secret.data }}
{{- if not (hasKey $secret.data "SECRET_KEY") }}
{{- fail (printf "api.auth.existingSecret %s is missing SECRET_KEY" .Values.api.auth.existingSecret) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trakr.api.fullname" . }}
  labels:
    {{- include "trakr.api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "trakr.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trakr.api.selectorLabels" . | nindent 8 }}
      annotations:
        {{- if .Values.api.auth.existingSecret }}
        checksum/secret: {{ .Values.api.auth.existingSecret | sha256sum }}
        {{- else }}
        checksum/secret: {{ include (print $.Template.BasePath "/api/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ printf "%s:%s" (required "api.image.repository is required when components.api is true" .Values.api.image.repository) (required "api.image.tag is required when components.api is true" .Values.api.image.tag) | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.containerPort }}
              protocol: TCP
          env:
            {{- include "trakr.api.env" . | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.securityContext.readOnlyRootFilesystem }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- end }}
      {{- if .Values.securityContext.readOnlyRootFilesystem }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
