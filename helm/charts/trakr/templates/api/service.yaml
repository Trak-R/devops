{{- if .Values.components.api }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trakr.api.fullname" . }}
  labels:
    {{- include "trakr.api.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "trakr.api.selectorLabels" . | nindent 4 }}
{{- end }}
