{{- if .Values.components.adsbSimulator }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trakr.adsbSimulator.fullname" . }}
  labels:
    {{- include "trakr.adsbSimulator.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "trakr.adsbSimulator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trakr.adsbSimulator.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adsb-simulator
          image: "{{ .Values.adsbSimulator.image.repository }}:{{ .Values.adsbSimulator.image.tag }}"
          imagePullPolicy: {{ .Values.adsbSimulator.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            - name: SIMULATOR_BIND_ADDRESS
              value: "0.0.0.0"
            - name: ConnectionStrings__BaseStationReaderDB
              value: "Data Source=/var/opt/adsbtracker/aircrafttracker.db;Default Timeout=5;Pooling=True"
            - name: ApplicationSettings__LogFile
              value: /var/opt/adsbtracker/TrackerHub.log
            - name: WebUi__TrackingProfilesPath
              value: /var/opt/adsbtrackingprofiles
            # Turning WebUi__UseHttpsRedirection off makes this image call ListenAnyIP(5000)
            # after configuration already bound that port. Keep the HTTPS endpoint on HTTP
            # so Kestrel does not look for a developer certificate.
            - name: Kestrel__Endpoints__Https__Url
              value: http://127.0.0.1:5001
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/opt/adsbtracker
            - name: profiles
              mountPath: /var/opt/adsbtrackingprofiles
          securityContext:
            runAsNonRoot: true
            runAsUser: 1654
            runAsGroup: 1654
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          {{- with .Values.adsbSimulator.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          emptyDir: {}
        - name: profiles
          emptyDir: {}
{{- end }}
