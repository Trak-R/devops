{{- if and .Values.components.pgadmin (not .Values.pgadmin.auth.existingSecret) }}
{{- $secretName := include "trakr.pgadmin.secretName" . }}
{{- $password := .Values.pgadmin.auth.password }}
{{- if not $password }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if and $existing $existing.data (index $existing.data "PGADMIN_DEFAULT_PASSWORD") }}
{{- $password = index $existing.data "PGADMIN_DEFAULT_PASSWORD" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 24 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "trakr.pgadmin.labels" . | nindent 4 }}
type: Opaque
stringData:
  PGADMIN_DEFAULT_PASSWORD: {{ $password | quote }}
{{- end }}
