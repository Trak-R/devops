apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "adsbtracker.fullname" . }}
  labels:
    {{- include "adsbtracker.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "adsbtracker.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "adsbtracker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "adsbtracker.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ if .Values.existingSecret }}{{ .Values.existingSecret | sha256sum }}{{ else }}{{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}{{ end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "adsbtracker.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- $nodeSelector := dict }}
      {{- if .Values.image.pinAmd64 }}
      {{- $_ := set $nodeSelector "kubernetes.io/arch" "amd64" }}
      {{- end }}
      {{- if .Values.nodeSelector }}
      {{- $nodeSelector = merge $nodeSelector .Values.nodeSelector }}
      {{- end }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: adsbtracker
          image: {{ include "adsbtracker.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "adsbtracker.fullname" . }}
            - secretRef:
                name: {{ include "adsbtracker.secretName" . }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1654
            runAsGroup: 1654
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ include "adsbtracker.dataMount" . }}
            - name: profiles
              mountPath: {{ include "adsbtracker.profilesMount" . }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "adsbtracker.labels" . | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.persistence.data.size }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
    - metadata:
        name: profiles
        labels:
          {{- include "adsbtracker.labels" . | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.persistence.profiles.size }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
