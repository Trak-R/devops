{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "adsbtracker.fullname" . }}
  labels:
    {{- include "adsbtracker.labels" . | nindent 4 }}
type: Opaque
stringData:
  ApplicationSettings__ApiServices__0__Key: {{ .Values.secrets.aeroDataBoxKey | quote }}
  ApplicationSettings__ApiServices__1__Key: {{ .Values.secrets.airLabsKey | quote }}
  ApplicationSettings__ApiServices__2__Key: {{ .Values.secrets.checkWxKey | quote }}
  ApplicationSettings__ApiServices__3__Key: {{ .Values.secrets.skyLinkKey | quote }}
  Mapbox__AccessToken: {{ .Values.secrets.mapboxToken | quote }}
{{- end }}
