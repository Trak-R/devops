apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "adsbtracker.fullname" . }}
  labels:
    {{- include "adsbtracker.labels" . | nindent 4 }}
data:
  ApplicationSettings__Host: {{ required "feed.host is required. Set the BaseStation feed hostname or address reachable from the pod." .Values.feed.host | quote }}
  ApplicationSettings__Port: {{ .Values.feed.port | quote }}
  ApplicationSettings__LogFile: {{ printf "%s/TrackerHub.log" (include "adsbtracker.dataMount" .) | quote }}
  WebUi__TrackingProfilesPath: {{ include "adsbtracker.profilesMount" . | quote }}
  WebUi__UseHttpsRedirection: "false"
  ConnectionStrings__BaseStationReaderDB: {{ printf "Data Source=%s/aircrafttracker.db;Default Timeout=5;Pooling=True" (include "adsbtracker.dataMount" .) | quote }}
