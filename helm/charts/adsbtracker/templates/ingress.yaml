{{- if .Values.ingress.enabled }}
{{- $host := required "ingress.host is required when ingress.enabled is true." .Values.ingress.host }}
{{- $annotations := dict "nginx.ingress.kubernetes.io/proxy-read-timeout" "3600" "nginx.ingress.kubernetes.io/proxy-send-timeout" "3600" }}
{{- with .Values.ingress.annotations }}
{{- $annotations = merge $annotations . }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "adsbtracker.fullname" . }}
  labels:
    {{- include "adsbtracker.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ required "ingress.tls.secretName is required when ingress TLS is enabled." .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "adsbtracker.fullname" . }}
                port:
                  number: 80
{{- end }}
