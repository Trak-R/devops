{{- if and .Values.components.argocd .Values.ghcr.secretName }}
{{- $src := lookup "v1" "Secret" .Release.Namespace .Values.ghcr.secretName }}
{{- if $src }}
{{- if or (not $src.data) (not (hasKey $src.data "username")) (not (hasKey $src.data "password")) }}
{{- fail (printf "Secret %s must contain username and password" .Values.ghcr.secretName) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: homenet-ghcr-charts
  labels:
    argocd.argoproj.io/secret-type: repo-creds
type: Opaque
data:
  url: {{ .Values.ghcr.registry | b64enc }}
  type: {{ "helm" | b64enc }}
  enableOCI: {{ "true" | b64enc }}
  username: {{ index $src.data "username" }}
  password: {{ index $src.data "password" }}
{{- end }}
{{- end }}
