# Parent flags. These are not passed into the subcharts.
components:
  argocd: true
  cloudflareTunnel: true
  headlamp: true
  openebs: true

# Ingress is served by the Traefik IngressClass that K3s installs.
# The server speaks HTTP because the tunnel terminates TLS.
argo-cd:
  fullnameOverride: homenet-argocd
  global:
    domain: argocd.example.com
  configs:
    params:
      server.insecure: true
  server:
    ingress:
      enabled: true
      ingressClassName: traefik
      hostname: argocd.example.com
      tls: false

headlamp:
  fullnameOverride: homenet-headlamp
  config:
    inCluster: true
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - host: headlamp.example.com
        paths:
          - path: /
            type: ImplementationSpecific

# Connector for the remotely managed tunnel vibeify-tunnel.
# Public hostnames are configured in Cloudflare. Create Secret
# homenet-cloudflare-token with key token before install.
cloudflared:
  replicaCount: 1
  image:
    repository: cloudflare/cloudflared
    tag: "2026.11.0"
    pullPolicy: IfNotPresent
  tunnelName: vibeify-tunnel
  secretName: homenet-cloudflare-token
  secretKey: token

# lvm-localpv 1.10.1 mounts the node plugin at lvmNode.kubeletDir.
# The chart default is /var/lib/kubelet/. K3s uses the path below.
# global.kubeletDir overrides lvmNode.kubeletDir when it is set; leave it empty.
lvm-localpv:
  lvmNode:
    kubeletDir: /var/lib/rancher/k3s/agent/kubelet

openebs:
  volumeGroup: openebs-vg
  storageClass:
    name: openebs-lvmpv
    defaultClass: false
