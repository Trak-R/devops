name: api
description: Run pytest and ruff, push the API image, and scan for fixed high and critical CVEs.

inputs:
  context:
    description: Build context, relative to the repository root.
    required: false
    default: .
  dockerfile:
    description: Dockerfile path, relative to the repository root.
    required: false
    default: apps/api/Dockerfile

outputs:
  image:
    description: Pushed image reference, including the commit SHA tag.
    value: ${{ steps.push.outputs.image }}

runs:
  using: composite
  steps:
    - name: Setup uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: "3.12"
        enable-cache: true

    - name: Sync dependencies
      shell: bash
      run: uv sync --frozen --all-packages

    - name: Run tests
      shell: bash
      run: uv run pytest

    - name: Ruff check
      shell: bash
      run: uv run ruff check .

    - name: Ruff format
      shell: bash
      run: uv run ruff format --check .

    - name: Build and push image
      id: push
      uses: $/pipelines/steps/container-push
      with:
        context: ${{ inputs.context }}
        dockerfile: ${{ inputs.dockerfile }}

    - name: CVE scan
      uses: $/pipelines/steps/cve-scan
      with:
        image: ${{ steps.push.outputs.image }}
