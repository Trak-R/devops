name: adsbtracker
description: Test Tracker Hub, scan it, push its image, and fail on fixed high and critical CVEs.

inputs:
  sonar-token:
    description: SonarQube token.
    required: true
  sonar-host-url:
    description: SonarQube server URL.
    required: true
  context:
    description: Build context, relative to the repository root.
    required: false
    default: .
  dockerfile:
    description: Dockerfile path, relative to the repository root.
    required: false
    default: docker/Dockerfile.source

outputs:
  image:
    description: Pushed image reference, including the commit SHA tag.
    value: ${{ steps.push.outputs.image }}

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.304

    - name: Run unit tests and generate code coverage
      shell: bash
      run: >
        dotnet test src/BaseStationReader.sln
        --settings src/BaseStationReader.Tests/mstest.runsettings
        /p:CollectCoverage=true
        /p:CoverletOutput=coverage/
        /p:CoverletOutputFormat=lcov

    - name: SonarQube
      uses: $/pipelines/steps/sonarqube
      with:
        token: ${{ inputs.sonar-token }}
        host-url: ${{ inputs.sonar-host-url }}

    - name: Build and push image
      id: push
      uses: $/pipelines/steps/container-push
      with:
        context: ${{ inputs.context }}
        dockerfile: ${{ inputs.dockerfile }}

    - name: CVE scan
      uses: $/pipelines/steps/cve-scan
      with:
        image: ${{ steps.push.outputs.image }}
