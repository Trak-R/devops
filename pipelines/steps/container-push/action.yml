name: Build and push image
description: Build a container image and push it to GitHub Container Registry, tagged with the commit SHA.

inputs:
  context:
    description: Build context, relative to the repository root.
    required: false
    default: .
  dockerfile:
    description: Dockerfile path, relative to the repository root.
    required: false
    default: Dockerfile
  image:
    description: Image name without a tag. Defaults to ghcr.io/<owner>/<repo>, lowercased.
    required: false
    default: ""
  token:
    description: Token used to push to GHCR.
    required: false
    default: ${{ github.token }}

outputs:
  image:
    description: Pushed image reference, including the commit SHA tag.
    value: ${{ steps.image.outputs.ref }}

runs:
  using: composite
  steps:
    - name: Resolve image
      id: image
      shell: bash
      run: |
        set -euo pipefail
        if [[ -n "${{ inputs.image }}" ]]; then
          name="${{ inputs.image }}"
        else
          name="ghcr.io/${GITHUB_REPOSITORY}"
        fi
        name="$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')"
        echo "ref=${name}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: ${{ github.workspace }}/${{ inputs.context }}
        file: ${{ github.workspace }}/${{ inputs.dockerfile }}
        push: true
        tags: ${{ steps.image.outputs.ref }}
